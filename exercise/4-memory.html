<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>4 · Memory</title>
</head>
<body>
  <script src="nest.js"></script>  <!-- your peacock, its feathers and your next quest -->

  <p id="status">No brain yet.</p>
  <input id="input" placeholder="Ask something...">
  <button id="send">Send</button>
  <p id="output"></p>

  <script type="module">
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");

    // ---- Chapter 1 · a brain ----
    import { CreateMLCEngine } from
      "https://esm.run/@mlc-ai/web-llm";

    const engine = await CreateMLCEngine(
      "gemma-2-2b-it-q4f16_1-MLC", {
        initProgressCallback: ({ text }) => {
          statusEl.textContent = text;
        }
      }
    );
    statusEl.textContent = "Model ready!";

    // ---- Chapter 3 · a character ----
    const system = {
      role: "system",
      content: "You are a pirate. " +
               "Answer in 2-3 sentences."
    };

    // ---- Chapter 4 · a memory ----
    const chatHistory = [system];

    async function ask(userText) {
      chatHistory.push({ role: "user", content: userText });      // before sending

      const chunks = await engine.chat.completions.create({
        messages: chatHistory,                                    // send all of it
        stream: true,
      });

      let reply = "";
      for await (const chunk of chunks) {
        reply += chunk.choices[0]?.delta.content || "";
        outputEl.textContent = reply;    // words appear as they are made
      }

      chatHistory.push({ role: "assistant", content: reply });    // after receiving
    }

    // Hands your code to the page: it calls ask() when you press Send. Nothing to change here.
    nest.start(ask, typeof engine === "undefined" ? null : engine);
  </script>
</body>
</html>
